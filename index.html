  <script>
    /**
     * ============================================================================
     * KONFIGURASI DEFAULT FRONTEND
     * ============================================================================
     */
    const DEFAULT_API_URL = "https://script.google.com/macros/s/AKfycbw5gSCF9-PvG0Mj11wbRst_VA2H3ji5b8h-mkI8kqs-DTP8XF6xllGZohic70vuuMai/exec"; // Tempel URL Web App Google Apps Script Anda di sini jika ingin permanen

    /**
     * ============================================================================
     * UTILITIES
     * ============================================================================
     */
    const Utils = {
      escapeHTML(str) {
        if (str === null || str === undefined) return "";
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      },

      formatDateTime(isoStr) {
        if (!isoStr) return "-";
        try {
          const d = new Date(isoStr);
          if (isNaN(d.getTime())) return String(isoStr);
          return d.toLocaleDateString("id-ID", {
            day: "2-digit",
            month: "short",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
          });
        } catch (e) {
          return String(isoStr);
        }
      },

      statusBadge(status) {
        const s = String(status || "").toUpperCase();
        const map = {
          APPROVED: "bg-success",
          FINISHED: "bg-success",
          PUBLISHED: "bg-success",
          LIVE: "bg-danger",
          SUBMITTED: "bg-primary",
          UPCOMING: "bg-primary",
          UNDER_REVIEW: "bg-warning text-dark",
          POSTPONED: "bg-warning text-dark",
          DRAFT: "bg-secondary",
          REJECTED: "bg-dark",
          CANCELLED: "bg-dark"
        };
        const cls = map[s] || "bg-secondary";
        return `<span class="badge ${cls}">${this.escapeHTML(s)}</span>`;
      },

      showToast(message, type = "primary") {
        const container = document.getElementById("toastContainer");
        if (!container) return;
        const id = "toast_" + Date.now() + "_" + Math.floor(Math.random() * 100);
        const bgClass = type === "danger" ? "text-bg-danger"
          : type === "success" ? "text-bg-success"
          : type === "warning" ? "text-bg-warning"
          : "text-bg-primary";

        const el = document.createElement("div");
        el.id = id;
        el.className = `toast align-items-center ${bgClass} border-0 shadow`;
        el.setAttribute("role", "alert");
        el.innerHTML = `
          <div class="d-flex">
            <div class="toast-body fw-medium">${this.escapeHTML(message)}</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
          </div>
        `;
        container.appendChild(el);
        const toastObj = new bootstrap.Toast(el, { delay: 4500 });
        toastObj.show();
        el.addEventListener("hidden.bs.toast", () => el.remove());
      }
    };

    /**
     * ============================================================================
     * CENTRALIZED API CLIENT (GITHUB PAGES <-> GOOGLE APPS SCRIPT)
     * ============================================================================
     */
    const ApiClient = {
      getBaseUrl() {
        return localStorage.getItem("BOASH_API_URL") || DEFAULT_API_URL;
      },

      setBaseUrl(url) {
        localStorage.setItem("BOASH_API_URL", String(url || "").trim());
      },

      async request(action, payload = {}, useAuth = false, timeoutMs = 15000) {
        const baseUrl = this.getBaseUrl();
        if (!baseUrl) {
          return {
            success: false,
            code: 0,
            message: "URL Web App Backend Google Apps Script belum dikonfigurasi. Klik tombol 'API Config' di bagian atas."
          };
        }

        const token = useAuth && Store.state.user ? Store.state.user.session_token : "";
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);

        try {
          const response = await fetch(baseUrl, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            redirect: "follow",
            signal: controller.signal,
            body: JSON.stringify({
              action: action,
              token: token,
              payload: payload
            })
          });

          clearTimeout(timer);
          const text = await response.text();
          let data;
          try {
            data = JSON.parse(text);
          } catch (parseErr) {
            return {
              success: false,
              code: 502,
              message: "Respons server bukan JSON yang valid. Pastikan Web App di-deploy dengan akses 'Anyone'."
            };
          }

          if (data.code === 401 && useAuth) {
            Store.clearSession();
          }

          return data;
        } catch (err) {
          clearTimeout(timer);
          if (err.name === "AbortError") {
            return { success: false, code: 408, message: "Koneksi ke server melebihi batas waktu (Timeout 15 detik)." };
          }
          return { success: false, code: 503, message: "Gagal menghubungi server backend: " + err.message };
        }
      }
    };

    /**
     * ============================================================================
     * APPLICATION STATE STORE
     * ============================================================================
     */
    const ADMIN_MENUS = [
      { id: "dashboard", label: "1. Dashboard", icon: "bi-speedometer2", perms: ["dashboard.view"] },
      { id: "pendaftaran", label: "2. Pendaftaran", icon: "bi-clipboard-check", perms: ["pendaftaran.view"] },
      { id: "sekolah", label: "3. Sekolah", icon: "bi-building", perms: ["sekolah.view", "pendaftaran.view", "peserta.manage"] },
      { id: "tim_futsal", label: "4. Tim Futsal", icon: "bi-shield-shaded", perms: ["peserta.manage"] },
      { id: "pemain_futsal", label: "5. Pemain Futsal", icon: "bi-people-fill", perms: ["peserta.manage"] },
      { id: "badminton", label: "6. Badminton", icon: "bi-trophy", perms: ["peserta.manage"] },
      { id: "hadroh", label: "7. Hadroh", icon: "bi-music-note-beamed", perms: ["peserta.manage", "hadroh.view"] },
      { id: "pembagian_grup", label: "8. Pembagian Grup", icon: "bi-diagram-3", perms: ["grup.manage"] },
      { id: "jadwal", label: "9. Jadwal", icon: "bi-calendar-event", perms: ["jadwal.manage"] },
      { id: "hasil", label: "10. Hasil", icon: "bi-scoreboard", perms: ["hasil.manage"] },
      { id: "klasemen", label: "11. Klasemen", icon: "bi-list-ol", perms: ["klasemen.view"] },
      { id: "penilaian_juri", label: "12. Penilaian Juri", icon: "bi-star-half", perms: ["hadroh.score", "hadroh.view"] },
      { id: "qr_checkin", label: "13. QR Check-in", icon: "bi-qr-code-scan", perms: ["checkin.manage"] },
      { id: "pengumuman", label: "14. Pengumuman", icon: "bi-megaphone", perms: ["*"] },
      { id: "galeri", label: "15. Galeri", icon: "bi-images", perms: ["*"] },
      { id: "sertifikat", label: "16. Sertifikat", icon: "bi-patch-check", perms: ["sertifikat.manage"] },
      { id: "whatsapp", label: "17. WhatsApp", icon: "bi-whatsapp", perms: ["whatsapp.send"] },
      { id: "laporan", label: "18. Laporan", icon: "bi-file-earmark-spreadsheet", perms: ["dashboard.view"] },
      { id: "manajemen_admin", label: "19. Manajemen Admin", icon: "bi-person-badge", perms: ["*"] },
      { id: "pengaturan", label: "20. Pengaturan", icon: "bi-gear-fill", perms: ["*"] }
    ];

    const Store = {
      state: {
        mode: new URLSearchParams(window.location.search).get("page") === "display" ? "display" : "public",
        publicTab: "beranda",
        futsalSubTab: "tim",
        regSubTab: "form",
        regFormCabang: "FUTSAL",
        regFutsalPlayers: Array.from({ length: 7 }, (_, i) => ({
          nama_pemain: "",
          nomor_punggung: String(i + 1),
          posisi: i === 0 ? "GK" : "PLAYER",
          is_kapten: i === 0
        })),
        regHadrohMembers: Array.from({ length: 5 }, (_, i) => ({
          nama_anggota: "",
          peran_alat: i === 0 ? "Vokal Utama" : "Terbang / Rebana"
        })),
        regFormDraft: {
          nama_sekolah: "",
          jenjang: "SD",
          npsn: "",
          alamat: "",
          kabupaten_kota: "",
          nama_kepsek: "",
          nama_pembina: "",
          no_wa_pembina: "",
          email_sekolah: "",
          futsal_nama_tim: "",
          futsal_kapten: "",
          futsal_official: "",
          futsal_logo: "",
          futsal_dokumen: "",
          bdm_kategori_id: "",
          bdm_pemain_1: "",
          bdm_pemain_2: "",
          hadroh_nama_grup: "",
          hadroh_ketua: "",
          hadroh_logo: ""
        },
        adminMenu: "dashboard",
        apiConnected: false,
        liveSyncStatus: "ACTIVE", // ACTIVE | SYNCING | ERROR
        lastSyncVersion: "",
        lastSyncTime: "-",
        user: (() => {
          try {
            const raw = localStorage.getItem("BOASH_USER_SESSION");
            return raw ? JSON.parse(raw) : null;
          } catch (e) {
            return null;
          }
        })(),
        bootstrap: {
          settings: {},
          stats: {},
          master: { badmintonCategories: [], hadrohCriteria: [] },
          announcements: []
        },
        portalData: {
          futsal: { teams: [], topScorers: [] },
          badminton: { participants: [] },
          hadroh: { groups: [], criteria: [], resultsPublished: false, standings: [] },
          schedules: [],

        },
        filters: {
          badmintonCat: "ALL",

          jadwalTanggal: "",
          jadwalStatus: "ALL",
          jadwalLapangan: "",
          jadwalSearch: "",
          hasilCabang: "ALL",
          hasilSearch: "",
          pengumumanKat: "ALL",
          adminRegCabang: "ALL",
          adminRegStatus: "ALL",

      hasAnyPermission(permList) {
        const u = this.state.user;
        if (!u) return false;
        const perms = u.permissions || [];
        if (perms.includes("*") || u.role_code === "SUPER_ADMIN") return true;
        return (permList || []).some(p => perms.includes(p));

      renderAdminPembagianGrup() {
        const td = Store.state.tournamentData || {};
        const userBranch = (Store.state.user && Store.state.user.cabang_assigned !== "ALL") ? Store.state.user.cabang_assigned : "ALL";
        const activeBranch = (userBranch === "FUTSAL" || userBranch === "BADMINTON")
          ? userBranch
          : (Store.state.filters.tourBranch === "BADMINTON" ? "BADMINTON" : "FUTSAL");
        const activeKat = Store.state.filters.tourBadmintonKat || "BDM-MS";
        const cats = td.badmintonCategories || [];

        const groups = (td.groups || []).filter(g =>
          g.cabang === activeBranch && (activeBranch === "FUTSAL" || g.kategori_id === activeKat)
        );

        const assignedIds = {};
        groups.forEach(g => (g.members || []).forEach(m => { assignedIds[m.entitas_id] = true; }));

        const eligiblePool = activeBranch === "FUTSAL"
          ? (td.eligibleEntities.FUTSAL || [])
          : (td.eligibleEntities.BADMINTON || []).filter(b => b.kategori_id === activeKat);
        const unassignedPool = eligiblePool.filter(e => !assignedIds[e.entitas_id]);

        return `
          <div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3 pb-3 border-bottom">

                <small class="text-muted">Atur grup penyisihan dan tempatkan peserta terverifikasi (APPROVED) secara acak atau manual.</small>
              </div>
              <div class="d-flex flex-wrap gap-2">
                ${userBranch === "ALL" ? `
                  <div class="btn-group">
                    <button class="btn btn-sm ${activeBranch === 'FUTSAL' ? 'btn-electric' : 'btn-outline-primary'}" onclick="App.setAdminFilter('tourBranch', 'FUTSAL')">FUTSAL</button>
                    <button class="btn btn-sm ${activeBranch === 'BADMINTON' ? 'btn-electric' : 'btn-outline-primary'}" onclick="App.setAdminFilter('tourBranch', 'BADMINTON')">BADMINTON</button>
                  </div>
                ` : ""}
                ${activeBranch === "BADMINTON" ? `
                  <select class="form-select form-select-sm" style="width:auto;" onchange="App.setAdminFilter('tourBadmintonKat', this.value)">
                    ${cats.map(c => `<option value="${Utils.escapeHTML(c.kategori_id)}" ${c.kategori_id === activeKat ? 'selected' : ''}>${Utils.escapeHTML(c.nama_kategori)}</option>`).join("")}
                  </select>
                  <button class="btn btn-sm btn-outline-secondary" onclick="App.openBadmintonRulesModal('${Utils.escapeHTML(activeKat)}')">
                    <i class="bi bi-sliders me-1"></i>Aturan Set
                  </button>
                ` : ""}
                <button class="btn btn-sm btn-outline-primary" onclick="App.openTournamentGroupModal()">
                  <i class="bi bi-plus-circle me-1"></i>Buat Grup
                </button>
                <button class="btn btn-sm btn-gold fw-bold" onclick="App.triggerAutoDrawGroups()">
                  <i class="bi bi-shuffle me-1"></i>Undian Acak (${unassignedPool.length})
                </button>
              </div>
            </div>

            <!-- PESERTA BELUM MASUK GRUP -->
            <div class="p-3 rounded-3 bg-light border mb-4">
              <div class="small fw-bold text-primary mb-2">Peserta APPROVED Belum Terdaftar di Grup (${unassignedPool.length})</div>
              ${unassignedPool.length > 0 ? `
                <div class="d-flex flex-wrap gap-2">
                  ${unassignedPool.map(ent => `
                    <div class="bg-white border rounded-3 px-2 py-1 small d-flex align-items-center gap-2">
                      <span class="fw-semibold">${Utils.escapeHTML(ent.nama_entitas)}</span>
                      ${groups.length > 0 ? `
                        <select class="form-select form-select-sm py-0" style="width:auto;" onchange="if(this.value) App.assignMemberManual(this.value, '${Utils.escapeHTML(ent.entitas_id)}')">
                          <option value="">+ Masukkan ke...</option>
                          ${groups.map(g => `<option value="${Utils.escapeHTML(g.grup_id)}">${Utils.escapeHTML(g.nama_grup)}</option>`).join("")}
                        </select>
                      ` : ""}
                    </div>
                  `).join("")}
                </div>
              ` : `<div class="small text-muted">Seluruh peserta APPROVED pada cabang/kategori ini sudah masuk ke dalam grup.</div>`}
            </div>

            <!-- DAFTAR GRUP -->
            <div class="row g-3">
              ${groups.length > 0 ? groups.map(grp => `
                <div class="col-md-6">
                  <div class="card border rounded-4 p-3 h-100">
                    <div class="d-flex justify-content-between align-items-center pb-2 mb-2 border-bottom">
                      <div>
                        <span class="fw-bold fs-5 text-primary">${Utils.escapeHTML(grp.nama_grup)}</span>
                        <span class="badge bg-secondary ms-1">${(grp.members || []).length}/${grp.max_peserta} Peserta</span>
                        <span class="badge bg-success-subtle text-success ms-1">Lolos: Top ${grp.jumlah_lolos}</span>
                      </div>
                      <div>
                        <button class="btn btn-sm btn-outline-primary py-0 px-2" onclick="App.openTournamentGroupModal('${Utils.escapeHTML(grp.grup_id)}')"><i class="bi bi-pencil"></i></button>

      renderAdminPenilaianJuri() {
        const hw = Store.state.hadrohWorkspace || {};
        const groups = hw.groups || [];
        const criteria = hw.criteria || [];
        const isJury = Boolean(hw.isJuryRole);

        if (isJury) {
          let selGroupId = Store.state.filters.hadrohSelectedGroupId;
          if (!selGroupId && groups.length > 0) {
            selGroupId = groups[0].grup_hadroh_id;
            Store.state.filters.hadrohSelectedGroupId = selGroupId;
          }
          const myScores = (hw.myScores || []).filter(s => s.grup_hadroh_id === selGroupId);
          const isLocked = myScores.some(s => s.is_locked);
          const scoreMap = {};
          myScores.forEach(s => { scoreMap[s.kriteria_id] = s.nilai_mentah; });

          return `
            <div class="card border-0 shadow-sm rounded-4 p-4">
              <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3 pb-3 border-bottom">
                <div>
                  <span class="badge bg-warning text-dark mb-1">LEMBAR PENILAIAN INDEPENDEN DEWAN JURI</span>
                  <h5 class="font-athletic fw-bold fs-4 mb-0">Penilaian Festival Hadroh — ${Utils.escapeHTML((hw.juriProfile && hw.juriProfile.nama_juri) || Store.state.user.nama_lengkap)}</h5>
                </div>
                <select class="form-select form-select-sm" style="max-width:320px;" onchange="App.setAdminFilter('hadrohSelectedGroupId', this.value)">
                  ${groups.map(g => `<option value="${Utils.escapeHTML(g.grup_hadroh_id)}" ${g.grup_hadroh_id === selGroupId ? 'selected' : ''}>No. Urut #${Utils.escapeHTML(g.nomor_urut_tampil)} — ${Utils.escapeHTML(g.nama_grup)} (${Utils.escapeHTML(g.nama_sekolah)})</option>`).join("")}
                </select>
              </div>

              ${selGroupId ? `
                ${isLocked ? `
                  <div class="alert alert-success d-flex align-items-center gap-2">
                    <i class="bi bi-lock-fill fs-4"></i>
                    <div><strong>Penilaian Terkunci:</strong> Anda telah mengirimkan nilai resmi untuk grup ini. Hubungi Admin Hadroh apabila memerlukan pembukaan kunci koreksi.</div>
                  </div>
                ` : ""}

                <form onsubmit="App.submitHadrohJuryForm(event, '${Utils.escapeHTML(selGroupId)}')">
                  <div class="table-responsive mb-3">
                    <table class="table table-bordered align-middle small">
                      <thead class="table-light">
                        <tr>
                          <th>Kriteria Penilaian</th>
                          <th class="text-center" style="width:95px;">Bobot</th>
                          <th class="text-center" style="width:130px;">Nilai (0 - Maks)</th>
                          <th class="text-center" style="width:120px;">Nilai Terbobot</th>
                        </tr>
                      </thead>
                      <tbody>
                        ${criteria.map(k => {
                          const val = scoreMap[k.kriteria_id] !== undefined ? scoreMap[k.kriteria_id] : "";
                          const weighted = val !== "" ? (Number(val) * (k.bobot_persen / 100)).toFixed(2) : "0.00";
                          return `
                            <tr>
                              <td>
                                <div class="fw-bold">${Utils.escapeHTML(k.nama_kriteria)}</div>
                                <div class="text-muted" style="font-size:0.75rem;">${Utils.escapeHTML(k.deskripsi)}</div>
                              </td>
                              <td class="text-center fw-bold text-primary">${k.bobot_persen}%</td>
                              <td>
                                <input type="number" step="0.5" min="0" max="${k.skor_maksimal}"
                                       class="form-control form-control-sm text-center fw-bold hadroh-score-input"
                                       data-kriteria-id="${Utils.escapeHTML(k.kriteria_id)}"
                                       data-bobot="${k.bobot_persen}"
                                       value="${val}" ${isLocked ? 'disabled' : 'required'}
                                       oninput="App.recalcHadrohLivePreview()" />
                              </td>
                              <td class="text-center fw-bold text-success" id="hadrohWeighted_${Utils.escapeHTML(k.kriteria_id)}">${weighted}</td>
                            </tr>
                          `;
                        }).join("")}
                      </tbody>
                      <tfoot class="table-light">
                        <tr>
                          <th colspan="3" class="text-end">Total Nilai Akhir Terbobot:</th>
                          <th class="text-center fs-5 text-primary" id="hadrohLiveWeightedTotal">
                            ${myScores.reduce((acc, s) => acc + Number(s.nilai_terbobot || 0), 0).toFixed(2)}
                          </th>
                        </tr>
                      </tfoot>
                    </table>
                  </div>

                  <div class="mb-3">
                    <label class="form-label small fw-semibold">Catatan Evaluasi Juri (Opsional)</label>
                    <input type="text" id="hadrohJuryNotes" class="form-control form-control-sm" value="${myScores[0] ? Utils.escapeHTML(myScores[0].catatan) : ''}" ${isLocked ? 'disabled' : ''} />
                  </div>

                  ${!isLocked ? `
                    <div class="text-end">
                      <button type="submit" id="btnSubmitHadrohScore" class="btn btn-gold px-4 fw-bold">
                        <i class="bi bi-lock-fill me-1"></i>Kirim & Kunci Penilaian
                      </button>
                    </div>
                  ` : ""}
                </form>
              ` : `<div class="p-4 text-center text-muted">Belum ada grup Hadroh yang berstatus APPROVED.</div>`}
            </div>
          `;
        }

        // Tampilan Rekap Admin Hadroh
        const recap = hw.recap || [];
        const isPub = String((Store.state.bootstrap.settings || {}).hadroh_results_published || "FALSE").toUpperCase() === "TRUE";

        return `

      renderAdminQrCheckin() {

          if (cw.filterStatus === "HADIR" && !it.checked_in) return false;
          if (cw.filterStatus === "BELUM" && it.checked_in) return false;
          if (q && !`${it.no_registrasi} ${it.nama_tim_atau_peserta} ${it.nama_sekolah}`.toLowerCase().includes(q)) return false;
          return true;

    /**

     */
    const App = {
      _displayRotateTimer: null,
      _displaySyncTimer: null,
      _displayClockTimer: null,

      async init() {
        Views.render();
        await this.refreshConnectionAndData();

        if (Store.state.mode === "display") {
          this.startDisplayTimers();
        } else if (Store.state.mode === "admin" && Store.state.user) {
          await this.loadAdminSummary();
        }
      },

      async refreshConnectionAndData() {
        const requests = [
          ApiClient.request("ping", {}, false),
          ApiClient.request("getPublicBootstrap", {}, false),
          ApiClient.request("getPublicPortalData", {}, false),
          ApiClient.request("getPublicGalleryData", {}, false)
        ];
        if (Store.state.mode === "display") {
          requests.push(ApiClient.request("getDisplayBoardData", {}, false));
        }

        const results = await Promise.all(requests);
        const pingRes = results[0];
        const bootRes = results[1];
        const portalRes = results[2];
        const galleryRes = results[3];
        const displayRes = results[4];

        Store.state.apiConnected = Boolean(pingRes && pingRes.success);

        if (bootRes && bootRes.success && bootRes.data) {
          Store.state.bootstrap = bootRes.data;
        }
        if (portalRes && portalRes.success && portalRes.data) {
          Store.state.portalData = portalRes.data;
        }
        if (galleryRes && galleryRes.success && galleryRes.data) {
          Store.state.galleryData = galleryRes.data;
        }
        if (displayRes && displayRes.success && displayRes.data) {
          Store.state.displayData = displayRes.data;
        }

        Store.state.displayLastSync = new Date().toLocaleTimeString("id-ID");
        Views.render();
      },

      switchMode(newMode) {
        this.stopQrCameraScanner();
        Store.state.mode = newMode;
        if (newMode === "admin" && Store.state.user) {
          this.selectAdminMenu(Store.state.adminMenu || "dashboard");
        } else {
          Views.render();
        }
      },

      switchPublicTab(tabId) {
        Store.state.publicTab = tabId;
        Views.render();
      },

      switchFutsalSubTab(subId) {
        Store.state.futsalSubTab = subId;
        Views.render();
      },

      switchRegSubTab(subId) {
        Store.state.regSubTab = subId;
        Views.render();
      },

      switchRegCabang(cabang) {
        Store.state.regFormCabang = cabang;
        Views.render();
      },

      setPublicFilter(key, val) {
        Store.state.filters[key] = val;
        Views.render();
      },

      resetJadwalFilters() {
        Store.state.filters.jadwalCabang = "ALL";

        Store.state.filters.jadwalStatus = "ALL";
        Store.state.filters.jadwalLapangan = "";
        Store.state.filters.jadwalSearch = "";
        Views.render();
      },

      setAdminFilter(key, val) {
        Store.state.filters[key] = val;
        Views.render();
      },

      openApiConfigModal() {
        document.getElementById("inputApiUrl").value = ApiClient.getBaseUrl();
        new bootstrap.Modal(document.getElementById("apiConfigModal")).show();
      },

      async saveApiConfig() {
        const url = document.getElementById("inputApiUrl").value.trim();
        ApiClient.setBaseUrl(url);
        bootstrap.Modal.getInstance(document.getElementById("apiConfigModal")).hide();
        Utils.showToast("Menghubungkan ke server backend...", "primary");
        await this.refreshConnectionAndData();
        if (Store.state.apiConnected) {
          Utils.showToast("Koneksi ke Google Apps Script berhasil!", "success");
        } else {
          Utils.showToast("Gagal terhubung. Periksa kembali URL Web App Anda.", "danger");
        }
      },

      openLoginModal() {
        new bootstrap.Modal(document.getElementById("loginModal")).show();
      },

      async handleLogin(e) {
        e.preventDefault();
        const username = document.getElementById("loginUsername").value.trim();
        const password = document.getElementById("loginPassword").value;
        const btn = document.getElementById("btnLoginSubmit");

        btn.disabled = true;
        btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span>Memverifikasi...`;

        const res = await ApiClient.request("authLogin", { username, password }, false);
        btn.disabled = false;
        btn.innerHTML = `<i class="bi bi-box-arrow-in-right me-1"></i>Masuk ke Dashboard`;

        if (!res.success) {
          Utils.showToast(res.message, "danger");
          return;
        }

        Store.setSession(res.data);
        bootstrap.Modal.getInstance(document.getElementById("loginModal")).hide();
        Utils.showToast(res.message, "success");
        Store.state.mode = "admin";
        await this.selectAdminMenu("dashboard");
      },

      async handleLogout() {
        await ApiClient.request("authLogout", {}, true);
        Store.clearSession();
        Store.state.mode = "public";
        Utils.showToast("Anda telah keluar dari sesi panitia.", "primary");
        Views.render();
      },

      async runInitDatabase() {
        Utils.showToast("Memeriksa dan menginisialisasi 27 sheet database...", "primary");
        const res = await ApiClient.request("initDatabase", {}, true);
        if (!res.success) return Utils.showToast(res.message, "danger");
        Utils.showToast(res.message, "success");
        await this.loadAdminSummary();
      },

      openAnnouncementDetail(pengumumanId) {
        const list = (Store.state.portalData && Store.state.portalData.announcements) || [];
        const item = list.find(a => a.pengumuman_id === pengumumanId);
        if (!item) return;

        document.getElementById("annModalCategory").textContent = item.kategori;
        document.getElementById("annModalTitle").textContent = item.judul;
        document.getElementById("annModalDate").textContent = "Dipublikasikan: " + Utils.formatDateTime(item.published_at);
        document.getElementById("annModalContent").textContent = item.konten || item.ringkasan;
        new bootstrap.Modal(document.getElementById("announcementDetailModal")).show();
      },

        if (!Store.state.regFormDraft) Store.state.regFormDraft = {};
        Store.state.regFormDraft[field] = val;
      },

        const readVal = (id, fallback = "") => {
          const el = document.getElementById(id);
          return el ? el.value : fallback;
        };
        const d = Store.state.regFormDraft || {};
        Store.state.regFormDraft = {
          ...d,
          nama_sekolah: readVal("regNamaSekolah", d.nama_sekolah),
          jenjang: readVal("regJenjang", d.jenjang || "SD"),
          npsn: readVal("regNpsn", d.npsn),
          alamat: readVal("regAlamat", d.alamat),
          kabupaten_kota: readVal("regKabKota", d.kabupaten_kota),
          nama_kepsek: readVal("regKepsek", d.nama_kepsek),
          nama_pembina: readVal("regPembina", d.nama_pembina),
          no_wa_pembina: readVal("regWaPembina", d.no_wa_pembina),
          email_sekolah: readVal("regEmailSekolah", d.email_sekolah),
          futsal_nama_tim: readVal("regFutsalNamaTim", d.futsal_nama_tim),
          futsal_nama_kapten: readVal("regFutsalKapten", d.futsal_nama_kapten),
          futsal_nama_official: readVal("regFutsalOfficial", d.futsal_nama_official),
          futsal_logo_url: readVal("regFutsalLogo", d.futsal_logo_url),

          bdm_pemain_2: readVal("regBdmPemain2", d.bdm_pemain_2)

          jenjang: "SD",
          npsn: "",
          alamat: "",
          kabupaten_kota: "",
          nama_kepsek: "",
          nama_pembina: "",
          no_wa_pembina: "",
          email_sekolah: "",
          futsal_nama_tim: "",
          futsal_nama_kapten: "",
          futsal_nama_official: "",
          futsal_logo_url: "",
          futsal_dokumen_url: "",
          hadroh_nama_grup: "",
          hadroh_nama_ketua: "",
          hadroh_logo_url: ""

      },

      addFutsalPlayerRow(maxPlayers) {
        if (Store.state.regFutsalPlayers.length >= maxPlayers) {
          Utils.showToast(`Maksimal pemain Futsal adalah ${maxPlayers} orang.`, "warning");
          return;
        }
        this.syncRegFormDraftFromDom();
        const nextNum = Store.state.regFutsalPlayers.length + 1;
        Store.state.regFutsalPlayers.push({
          nama_pemain: "",
          nomor_punggung: String(nextNum),
          posisi: "PLAYER",
          is_kapten: false
        });
        Views.render();
      },

      removeFutsalPlayerRow(idx, minPlayers) {
        if (Store.state.regFutsalPlayers.length <= minPlayers) {
          Utils.showToast(`Minimal pemain Futsal adalah ${minPlayers} orang.`, "warning");
          return;
        }
        this.syncRegFormDraftFromDom();
        Store.state.regFutsalPlayers.splice(idx, 1);
        Views.render();
      },

      updateFutsalPlayerField(idx, field, val) {
        if (Store.state.regFutsalPlayers[idx]) {
          Store.state.regFutsalPlayers[idx][field] = val;
        }
      },

      setFutsalCaptain(idx) {
        Store.state.regFutsalPlayers.forEach((p, i) => {
          p.is_kapten = i === idx;
        });
      },

      addHadrohMemberRow() {
        if (Store.state.regHadrohMembers.length >= 20) {
          Utils.showToast("Maksimal anggota grup Hadroh adalah 20 orang.", "warning");
          return;
        }
        Store.state.regHadrohMembers.push({
          nama_anggota: "",
          peran_alat: "Terbang / Rebana"
        });
        Views.render();
      },

      removeHadrohMemberRow(idx) {
        if (Store.state.regHadrohMembers.length <= 3) {
          Utils.showToast("Minimal anggota grup Hadroh adalah 3 orang.", "warning");
          return;
        }
        Store.state.regHadrohMembers.splice(idx, 1);
        Views.render();

      updateHadrohMemberField(idx, field, val) {
        if (Store.state.regHadrohMembers[idx]) {
          Store.state.regHadrohMembers[idx][field] = val;
        }
      },

      async handlePublicRegistrationSubmit(e) {
        e.preventDefault();
        const cabang = Store.state.regFormCabang;
        const payload = {
          cabang: cabang,
          school: {
            nama_sekolah: document.getElementById("regNamaSekolah").value,
            jenjang: document.getElementById("regJenjang").value,
            npsn: document.getElementById("regNpsn").value,
            alamat: document.getElementById("regAlamat").value,
            kabupaten_kota: document.getElementById("regKabKota").value,
            nama_kepsek: document.getElementById("regKepsek").value,
            nama_pembina: document.getElementById("regPembina").value,
            no_wa_pembina: document.getElementById("regWaPembina").value,
            email_sekolah: document.getElementById("regEmailSekolah").value
          }
        };

        if (cabang === "FUTSAL") {
          payload.futsal = {
            nama_tim: document.getElementById("regFutsalNamaTim").value,
            nama_kapten: document.getElementById("regFutsalKapten").value,
            nama_official: document.getElementById("regFutsalOfficial").value,
            logo_url: document.getElementById("regFutsalLogo").value,
            dokumen_url: document.getElementById("regFutsalDokumen").value,
            players: Store.state.regFutsalPlayers
          };
        } else if (cabang === "BADMINTON") {
          const p2El = document.getElementById("regBdmPemain2");
          payload.badminton = {
            kategori_id: document.getElementById("regBdmKategori").value,
            nama_pemain_1: document.getElementById("regBdmPemain1").value,
            nama_pemain_2: p2El ? p2El.value : ""
          };
        } else if (cabang === "HADROH") {
          payload.hadroh = {
            nama_grup: document.getElementById("regHadrohNamaGrup").value,
            nama_ketua: document.getElementById("regHadrohKetua").value,
            logo_url: document.getElementById("regHadrohLogo").value,
            members: Store.state.regHadrohMembers
          };
        }

        const btn = document.getElementById("btnSubmitRegistration");
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Mengirim Data...`;

        const res = await ApiClient.request("submitRegistration", payload, false);
        btn.disabled = false;
        btn.innerHTML = `<i class="bi bi-send-check-fill me-2"></i>Kirim Pendaftaran Sekarang`;

        if (!res.success) {
          Utils.showToast(res.message, "danger");
          return;
        }

        Store.state.registrationResult = res.data;
        Utils.showToast(res.message, "success");
        Views.render();
      },

      async handleCheckRegistrationStatus(e) {
        e.preventDefault();
        const noReg = document.getElementById("inputCheckNoReg").value.trim().toUpperCase();
        const btn = document.getElementById("btnCheckNoReg");
        btn.disabled = true;

        const res = await ApiClient.request("checkRegistrationStatus", { no_registrasi: noReg }, false);
        btn.disabled = false;

        if (!res.success) {
          Store.state.checkedRegistration = null;
          Utils.showToast(res.message, "danger");
          Views.render();
          return;
        }

        Store.state.checkedRegistration = res.data;
        Views.render();
      },

      renderQrCanvas(qrToken) {
        const container = document.getElementById("publicQrCanvas");
        if (!container || typeof QRCode === "undefined") return;
        container.innerHTML = "";
        new QRCode(container, {
          text: qrToken,
          width: 200,
          height: 200,
          colorDark: "#0A192F",
          colorLight: "#FFFFFF",
          correctLevel: QRCode.CorrectLevel.H
        });
      },

      downloadQrImage(noRegistrasi) {
        const canvas = document.querySelector("#publicQrCanvas canvas");
        const img = document.querySelector("#publicQrCanvas img");
        let dataUrl = "";
        if (canvas) dataUrl = canvas.toDataURL("image/png");
        else if (img) dataUrl = img.src;

        if (!dataUrl) {
          Utils.showToast("Gambar QR Code belum siap.", "warning");
          return;
        }
        const a = document.createElement("a");
        a.href = dataUrl;
        a.download = `QR_${noRegistrasi}.png`;
        a.click();
      },

      /* --- ADMIN DASHBOARD CONTROLLERS --- */
      async selectAdminMenu(menuId) {
        if (menuId !== "qr_checkin") {
          this.stopQrCameraScanner();
        }
        Store.state.adminMenu = menuId;
        Views.render();

        if (menuId === "dashboard") {
          await this.loadAdminSummary();
          return;
        }
        if (menuId === "pendaftaran") {
          await this.loadAdminRegistrations();
          return;
        }
        if (menuId === "sekolah") {
          await this.loadAdminSchools();
          return;
        }
        if (["tim_futsal", "pemain_futsal", "badminton", "hadroh"].includes(menuId)) {
          await this.loadAdminParticipants();
          return;
        }
        if (["pembagian_grup", "jadwal", "hasil", "klasemen"].includes(menuId)) {
          await this.loadAdminTournamentData();
          return;
        }
        if (menuId === "penilaian_juri") {
          await this.loadHadrohScoringWorkspace();
          return;
        }
        if (menuId === "qr_checkin") {
          await this.loadAdminCheckinData();
          return;
        }
        if (menuId === "galeri") {
          await this.loadAdminGallery();
          return;
        }
        if (menuId === "sertifikat") {
          await this.loadAdminCertificates();
          return;
        }
        if (menuId === "whatsapp") {
          await this.loadAdminWhatsAppWorkspace();
          return;
        }
        if (menuId === "pengumuman") {
          await this.loadAdminAnnouncements();
          return;
        }
        if (menuId === "laporan") {
          await Promise.all([
            this.loadAdminRegistrations(),
            this.loadAdminSchools(),
            this.loadAdminParticipants(),
            this.loadAdminTournamentData(),
            this.loadHadrohScoringWorkspace()
          ]);
          return;
        }
        if (menuId === "manajemen_admin") {
          await this.loadAdminUsers();
          return;
        }
        if (menuId === "pengaturan") {
          await this.loadAdminSettings();
          return;
        }
      },

        const res = await ApiClient.request("getAdminDashboardSummary", {}, true);
        if (res.success && res.data) {
          Store.state.adminSummary = res.data;
        } else {
          Utils.showToast(res.message, "danger");
        }
        Views.renderAdminDashboard();

          Store.state.adminRegistrations = res.data.registrations || [];
        } else {
          Utils.showToast(res.message, "danger");

      exportCsvReport(type) {
        let rows = [];
        let filename = `BOASH_${type}_${new Date().toISOString().slice(0, 10)}.csv`;

        if (type === "registrations") {
          rows.push(["No Registrasi", "Cabang", "Kategori", "Nama Tim/Peserta", "Sekolah", "Pembina", "No WA", "Status", "Tanggal Daftar"]);
          (Store.state.adminRegistrations || []).forEach(r => {
            rows.push([r.no_registrasi, r.cabang, r.kategori_nama || "-", r.nama_tim_atau_peserta, r.nama_sekolah, r.nama_pembina, r.no_wa_pembina, r.status, r.created_at]);
          });
        } else if (type === "schools") {
          rows.push(["ID Sekolah", "NPSN", "Nama Sekolah", "Jenjang", "Kabupaten/Kota", "Kepala Sekolah", "Pembina", "No WA", "Total Daftar", "Approved"]);
          (Store.state.adminSchools || []).forEach(s => {
            rows.push([s.sekolah_id, s.npsn, s.nama_sekolah, s.jenjang, s.kabupaten_kota, s.nama_kepsek, s.nama_pembina, s.no_wa_pembina, s.total_pendaftaran, s.approved_count]);
          });
        } else if (type === "futsal_players") {
          rows.push(["Tim Futsal", "Asal Sekolah", "No Punggung", "Nama Pemain", "Posisi", "Kapten", "Gol", "Kartu Kuning", "Kartu Merah"]);
          ((Store.state.adminParticipants && Store.state.adminParticipants.futsalTeams) || []).forEach(t => {
            (t.players || []).forEach(p => {
              rows.push([t.nama_tim, t.nama_sekolah, p.nomor_punggung, p.nama_pemain, p.posisi, p.is_kapten, p.gol_total || 0, p.kartu_kuning || 0, p.kartu_merah || 0]);
            });
          });
        } else if (type === "standings") {
          rows.push(["Cabang", "Kategori", "Grup", "Posisi", "Peserta/Tim", "Main", "Menang", "Seri", "Kalah", "Skor Masuk", "Skor Kemasukan", "Selisih", "Poin"]);
          ((Store.state.tournamentData && Store.state.tournamentData.standings) || []).forEach(s => {
            rows.push([s.cabang, s.nama_kategori || "-", s.nama_grup, s.posisi, s.nama_entitas, s.main, s.menang, s.seri, s.kalah, s.skor_masuk, s.skor_kemasukan, s.selisih_skor, s.poin]);
          });
        } else if (type === "schedules") {
          rows.push(["Kode", "Cabang", "Kategori", "Tahap", "Grup", "Peserta A", "Skor A", "Skor B", "Peserta B", "Tanggal", "Jam", "Lapangan", "Status"]);
          ((Store.state.tournamentData && Store.state.tournamentData.schedules) || []).forEach(j => {
            rows.push([j.kode_pertandingan, j.cabang, j.nama_kategori || "-", j.tahap, j.nama_grup || "-", j.nama_entitas_a, j.skor_a, j.skor_b, j.nama_entitas_b, j.tanggal, j.jam_mulai, j.lapangan, j.status]);
          });
        } else if (type === "hadroh_scores") {
          rows.push(["Peringkat", "No Urut Tampil", "Nama Grup Hadroh", "Asal Sekolah", "Jumlah Juri", "Nilai Akhir Terbobot"]);
          ((Store.state.hadrohWorkspace && Store.state.hadrohWorkspace.recap) || []).forEach((h, idx) => {
            rows.push([idx + 1, h.nomor_urut_tampil, h.nama_grup, h.nama_sekolah, h.jumlah_juri, h.nilai_akhir]);
          });
        }

        const csvContent = rows.map(r => r.map(cell => `"${String(cell || "").replace(/"/g, '""')}"`).join(",")).join("\n");
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        link.click();
        Utils.showToast("Laporan CSV berhasil diunduh.", "success");
      },

      async toggleQrCameraScanner() {
        if (Store.state.checkinWorkspace.scannerActive) {
          await this.stopQrCameraScanner();
          Views.renderAdminDashboard();
          return;
        }

        if (typeof Html5Qrcode === "undefined") {
          Utils.showToast("Library kamera QR belum termuat. Gunakan input manual atau barcode scanner.", "warning");
          return;
        }

        Store.state.checkinWorkspace.scannerActive = true;
        Views.renderAdminDashboard();

        setTimeout(async () => {
          try {
            const scanner = new Html5Qrcode("qrReaderContainer");
            this._html5QrScanner = scanner;
            await scanner.start(
              { facingMode: "environment" },
              { fps: 10, qrbox: { width: 210, height: 210 } },
              async (decodedText) => {
                const nowMs = Date.now();
                if (decodedText === this._lastScannedCode && (nowMs - this._lastScannedAt) < 4000) {
                  return;
                }
                this._lastScannedCode = decodedText;
                this._lastScannedAt = nowMs;
                await this.submitCheckinCode(decodedText, "QR_CAMERA");
              },
              () => {}
            );
          } catch (err) {
            Store.state.checkinWorkspace.scannerActive = false;
            Utils.showToast("Kamera tidak dapat diakses (" + err.message + "). Gunakan input manual atau USB barcode scanner.", "warning");
            Views.renderAdminDashboard();
          }
        }, 120);
      },

      async stopQrCameraScanner() {
        Store.state.checkinWorkspace.scannerActive = false;
        if (this._html5QrScanner) {
          try {
            await this._html5QrScanner.stop();
            this._html5QrScanner.clear();
          } catch (e) {}
          this._html5QrScanner = null;
        }
      },

      async submitGalleryForm(e, galeriId) {
        e.preventDefault();
        const btn = document.getElementById("btnSubmitGalleryForm");
        const fileInp = document.getElementById("galFormFile");
        const fileObj = fileInp && fileInp.files && fileInp.files[0] ? fileInp.files[0] : null;

        if (fileObj && fileObj.size > 4 * 1024 * 1024) {
          return Utils.showToast("Ukuran file foto maksimal 4 MB agar unggahan ke Google Drive stabil.", "warning");
        }

        btn.disabled = true;
        btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span>Mengunggah...`;

        let fileBase64 = "";
        let fileName = "";
        let mimeType = "";

        if (fileObj) {
          fileName = fileObj.name;
          mimeType = fileObj.type || "image/jpeg";
          fileBase64 = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => {
              const parts = String(reader.result || "").split(",");
              resolve(parts[1] || "");
            };
            reader.onerror = () => reject(new Error("Gagal membaca file lokal."));
            reader.readAsDataURL(fileObj);
          });
        }

        const res = await ApiClient.request("saveGalleryMedia", {
          galeri_id: galeriId,
          judul: document.getElementById("galFormJudul").value,
          tanggal_kegiatan: document.getElementById("galFormDate").value,
          album: document.getElementById("galFormAlbum").value,
          kategori: document.getElementById("galFormKat").value,
          tipe_media: document.getElementById("galFormTipe").value,
          media_url: document.getElementById("galFormUrl").value,
          is_published: document.getElementById("galFormPub").value,
          deskripsi: document.getElementById("galFormDesc").value,
          file_base64: fileBase64,
          file_name: fileName,
          mime_type: mimeType
        }, true, 25000);

        btn.disabled = false;
        btn.innerHTML = `Simpan ke Galeri`;

        if (!res.success) return Utils.showToast(res.message, "danger");
        bootstrap.Modal.getInstance(document.getElementById("adminActionModal")).hide();
        Utils.showToast(res.message, "success");
        await this.loadAdminGallery();

                <label class="form-label small fw-semibold">Kategori (Opsional)</label>
                <input type="text" id="certFormKategori" class="form-control form-control-sm" placeholder="Contoh: Tunggal Putra / -" value="-" />
              </div>
            </div>
            <div class="text-end mt-4">
              <button type="submit" id="btnGenSingleCert" class="btn btn-gold btn-sm px-4 fw-bold">
                <i class="bi bi-file-earmark-pdf-fill me-1"></i>Generate PDF ke Google Drive
              </button>
            </div>
          </form>
        `;
        new bootstrap.Modal(document.getElementById("adminActionModal")).show();
      },

      async submitSingleCertificateForm(e) {
        e.preventDefault();
        const btn = document.getElementById("btnGenSingleCert");
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span>Membuat PDF...`;

        const res = await ApiClient.request("generateCertificatePdf", {
          jenis_sertifikat: document.getElementById("certFormJenis").value,
          cabang: document.getElementById("certFormCabang").value,
          tanggal_terbit: document.getElementById("certFormDate").value,
          nama_penerima: document.getElementById("certFormPenerima").value,
          nama_sekolah: document.getElementById("certFormSekolah").value,
          pencapaian: document.getElementById("certFormPencapaian").value,
          kategori: document.getElementById("certFormKategori").value
        }, true, 25000);

        btn.disabled = false;
        btn.innerHTML = `<i class="bi bi-file-earmark-pdf-fill me-1"></i>Generate PDF ke Google Drive`;

        if (!res.success) return Utils.showToast(res.message, "danger");
        bootstrap.Modal.getInstance(document.getElementById("adminActionModal")).hide();
        Utils.showToast(res.message, "success");
        await this.loadAdminCertificates();
      },

      openBatchCertificateModal() {
        document.getElementById("admActModalBadge").textContent = "BATCH GENERATOR";
        document.getElementById("admActModalTitle").textContent = "Generate Sertifikat PDF Massal";
        document.getElementById("admActModalBody").innerHTML = `
          <form onsubmit="App.submitBatchCertificateForm(event)">
            <p class="small text-muted mb-3">
              Sistem akan menerbitkan file sertifikat PDF resmi secara otomatis ke Google Drive beserta kode verifikasi unik untuk data yang belum memiliki sertifikat (maksimal 15 dokumen per proses).
            </p>
            <div class="row g-3">
              <div class="col-md-7">
                <label class="form-label small fw-semibold">Target Penerbitan Otomatis *</label>
                <select id="batchCertMode" class="form-select form-select-sm">
                  <option value="CHAMPIONS">Seluruh Pemenang Resmi (Tabel Juara)</option>
                  <option value="APPROVED_PARTICIPANTS">Seluruh Kontingen Terverifikasi (Status APPROVED)</option>
                </select>
              </div>
              <div class="col-md-5">
                <label class="form-label small fw-semibold">Tanggal Terbit</label>
                <input type="date" id="batchCertDate" class="form-control form-control-sm" value="${new Date().toISOString().split('T')[0]}" required />
              </div>
            </div>
            <div class="text-end mt-4">
              <button type="submit" id="btnGenBatchCert" class="btn btn-gold btn-sm px-4 fw-bold">Jalankan Batch Generator</button>
            </div>
          </form>
        `;
        new bootstrap.Modal(document.getElementById("adminActionModal")).show();
      },

      async submitBatchCertificateForm(e) {
        e.preventDefault();
        const btn = document.getElementById("btnGenBatchCert");
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span>Memproses PDF...`;

        const res = await ApiClient.request("batchGenerateCertificates", {
          batch_mode: document.getElementById("batchCertMode").value,
          tanggal_terbit: document.getElementById("batchCertDate").value
        }, true, 30000);

        btn.disabled = false;
        btn.innerHTML = `Jalankan Batch Generator`;

        if (!res.success) return Utils.showToast(res.message, "danger");
        bootstrap.Modal.getInstance(document.getElementById("adminActionModal")).hide();
        Utils.showToast(res.message, "success");
        await this.loadAdminCertificates();
      },

      requestDeleteCertificate(id) {
        Store.state.confirmDeleteCertId = id;
        Views.renderAdminDashboard();
      },

      cancelDeleteCertificate() {
        Store.state.confirmDeleteCertId = null;
        Views.renderAdminDashboard();
      },

      async confirmDeleteCertificate(id) {
        Store.state.confirmDeleteCertId = null;
        const res = await ApiClient.request("deleteCertificate", { sertifikat_id: id }, true);
        if (!res.success) return Utils.showToast(res.message, "danger");
        Utils.showToast(res.message, "success");
        await this.loadAdminCertificates();
      },

      copyTextToClipboard(text) {
        const tempInput = document.createElement("textarea");
        tempInput.value = text;
        tempInput.style.position = "fixed";
        tempInput.style.opacity = "0";
        document.body.appendChild(tempInput);
        tempInput.select();
        try {
          document.execCommand("copy");
          Utils.showToast("Kode verifikasi '" + text + "' disalin ke clipboard.", "success");
        } catch (e) {
          Utils.showToast("Gagal menyalin teks.", "warning");
        }
        document.body.removeChild(tempInput);
      },

      /* --- PHASE 8: WHATSAPP COMMUNICATION CONTROLLERS --- */
      async loadAdminWhatsAppWorkspace() {
        const res = await ApiClient.request("getAdminWhatsAppWorkspace", {}, true);
        if (res.success && res.data) {
          Store.state.whatsappWorkspace.gatewayConfigured = Boolean(res.data.gatewayConfigured);
          Store.state.whatsappWorkspace.providerType = res.data.providerType || "MANUAL_WA_ME";
          Store.state.whatsappWorkspace.stats = res.data.stats || {};
          Store.state.whatsappWorkspace.logs = res.data.logs || [];
          Store.state.whatsappWorkspace.recipients = res.data.recipients || [];
        } else {
          Utils.showToast(res.message, "danger");
        }
        Views.renderAdminDashboard();
      },

      setWhatsappFilter(key, val) {
        Store.state.whatsappWorkspace[key] = val;
        Views.renderAdminDashboard();
      },

      switchWhatsappComposeMode(mode) {
        Store.state.whatsappWorkspace.composeMode = mode;
        Views.renderAdminDashboard();
      },

      applyWhatsappTemplate(tplKey) {
        const box = document.getElementById("waComposerMessage");
        if (!box) return;
        const templates = {
          TECH_MEETING: "Assalamu'alaikum Yth. Bapak/Ibu {nama_pembina} ({nama_sekolah}). Mengundang perwakilan kontingen *{nama_tim}* (No. Reg: {no_registrasi} - Cabang {cabang}) untuk menghadiri Technical Meeting VENSIX VOL 7 di Aula Utama SMP BOASH. Terima kasih.",
          APPROVED_QR: "Selamat Bapak/Ibu {nama_pembina} ({nama_sekolah})! Pendaftaran *{nama_tim}* ({no_registrasi}) pada cabang {cabang} telah berstatus *APPROVED*. Silakan buka menu Pendaftaran > Cek Status & QR Code di website resmi untuk mengunduh QR Check-In.",
          MATCH_REMINDER: "Pengingat Jadwal VENSIX: Kontingen *{nama_tim}* ({nama_sekolah}) cabang {cabang} dimohon hadir 30 menit sebelum jadwal pertandingan/penampilan dimulai untuk melakukan verifikasi ulang di meja panitia SMP BOASH."
        };
        if (templates[tplKey]) {
          box.value = templates[tplKey];
        }
      },

      insertWhatsappVariable(tokenStr) {
        const box = document.getElementById("waComposerMessage");
        if (!box) return;
        const start = box.selectionStart || box.value.length;
        const end = box.selectionEnd || box.value.length;
        box.value = box.value.substring(0, start) + tokenStr + box.value.substring(end);
        box.focus();
      },

      async submitWhatsAppComposerForm(e) {
        e.preventDefault();
        const mode = Store.state.whatsappWorkspace.composeMode;
        const payload = {
          mode: mode,
          tipe_notifikasi: document.getElementById("waTemplatePreset").value || "ADMIN_MESSAGE",
          pesan: document.getElementById("waComposerMessage").value
        };

        if (mode === "SINGLE") {
          payload.pendaftaran_id = document.getElementById("waSingleRegId").value;
          payload.nama_penerima = document.getElementById("waCustomName").value;
          payload.nomor_tujuan = document.getElementById("waCustomPhone").value;
        } else {
          payload.filter_cabang = document.getElementById("waBroadcastBranch").value;
          payload.filter_status = document.getElementById("waBroadcastStatus").value;
        }

        const btn = document.getElementById("btnSubmitWaComposer");
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span>Memproses...`;

        const res = await ApiClient.request("sendWhatsAppNotification", payload, true);
        btn.disabled = false;
        btn.innerHTML = `<i class="bi bi-send-fill me-1"></i>Kirim / Proses Pesan WhatsApp`;

        if (!res.success) return Utils.showToast(res.message, "danger");
        Utils.showToast(res.message, "success");

        if (res.data && !res.data.gatewayConfigured && res.data.firstWaLink) {
          window.open(res.data.firstWaLink, "_blank");
        }
        await this.loadAdminWhatsAppWorkspace();
      },

      async dispatchManualWaLink(waLogId, waUrl) {
        if (waUrl) {
          window.open(waUrl, "_blank");
        }
        const res = await ApiClient.request("markWhatsAppLogSent", { wa_log_id: waLogId }, true);
        if (res.success) {
          await this.loadAdminWhatsAppWorkspace();
        }
      },

      async retryWhatsAppLog(waLogId) {
        const res = await ApiClient.request("retryWhatsAppLog", { wa_log_id: waLogId }, true);
        if (!res.success) return Utils.showToast(res.message, "danger");
        Utils.showToast(res.message, "success");
        if (res.data && !res.data.dispatchedViaApi && res.data.wa_manual_link) {
          window.open(res.data.wa_manual_link, "_blank");
        }
        await this.loadAdminWhatsAppWorkspace();
      },

      /* --- PHASE 9: SYSTEM DIAGNOSTICS & CACHE CONTROLLERS --- */
      async runSystemDiagnostics(autoRepair = false) {
        Utils.showToast(autoRepair ? "Menjalankan audit & perbaikan otomatis..." : "Menjalankan audit integritas 27 sheet...", "primary");
        const res = await ApiClient.request("runSystemDiagnostics", { autoRepair: autoRepair }, true);
        if (!res.success) return Utils.showToast(res.message, "danger");
        Store.state.systemDiagnostics = res.data;
        Utils.showToast(res.message, res.data && res.data.healthy ? "success" : "warning");
        Views.renderAdminDashboard();
      },

      async clearSystemCache() {
        const res = await ApiClient.request("clearSystemCache", {}, true);
        if (!res.success) return Utils.showToast(res.message, "danger");
        Utils.showToast(res.message, "success");
      },

      /* --- DISPLAY MODE TIMERS & CONTROLS --- */
      setDisplayPanel(idx) {
        Store.state.displayPanelIndex = idx;
        Views.render();
      },

      toggleDisplayPause() {
        Store.state.displayPaused = !Store.state.displayPaused;
        Views.render();
      },

      toggleDisplayFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      },

      startDisplayTimers() {
        this.stopDisplayTimers();
        const settings = (Store.state.displayData && Store.state.displayData.settings) || (Store.state.bootstrap && Store.state.bootstrap.settings) || {};
        const rotateSec = parseInt(settings.display_rotate_seconds || "12", 10);

        this._displayClockTimer = setInterval(() => {
          const el = document.getElementById("displayClockText");
          if (el) el.textContent = new Date().toLocaleTimeString("id-ID");
        }, 1000);

        this._displayRotateTimer = setInterval(() => {
          if (!Store.state.displayPaused) {
            Store.state.displayPanelIndex = (Store.state.displayPanelIndex + 1) % 3;
            Views.render();
          }
        }, Math.max(5, rotateSec) * 1000);

        this._displaySyncTimer = setInterval(() => {
          this.refreshConnectionAndData();
        }, 20000);
      },

      stopDisplayTimers() {
        if (this._displayClockTimer) clearInterval(this._displayClockTimer);
        if (this._displayRotateTimer) clearInterval(this._displayRotateTimer);
        if (this._displaySyncTimer) clearInterval(this._displaySyncTimer);
      }
    };
    /**
 * ============================================================================
 * BOASH CHAMPIONSHIP HUB - COMPLETE AUTO LIVE SYNC & ADMIN REFRESH ENGINE
 * Phase 10 & 11 Production Ready (Drop-in Script sebelum)
 * ============================================================================
 */
      /**
     * ============================================================================
     * REAL LIVE SYNC ENGINE (TERINTEGRASI DENGAN STORE, APICLIENT & VIEWS)
     * ============================================================================
     */
    const BCH_SYNC_CONFIG = {
      POLL_INTERVAL_MS: 8000,       // Cek pulse perubahan database setiap 8 detik
      FORCE_REFRESH_EVERY_TICKS: 4  // Sinkronisasi penuh berkala tiap ~32 detik
    };

    Object.assign(App, {
      _liveSyncTimer: null,
      _isSyncing: false,
      _syncTickCount: 0,

      setLiveSyncState(status, timeStr) {
        Store.state.liveSyncStatus = status;
        if (timeStr) Store.state.lastSyncTime = timeStr;

        const badge = document.getElementById("liveSyncBadge");
        const dot = document.getElementById("liveSyncDot");
        const textEl = document.getElementById("liveSyncText");
        if (!badge || !textEl) return;

        badge.className = "btn btn-sm bg-white fw-bold d-inline-flex align-items-center gap-1 px-2 py-1 shadow-sm " + (
          status === "SYNCING" ? "text-primary border-primary" :
          status === "ERROR" ? "text-danger border-danger" :
          "text-success border-success"
        );

        if (dot) {
          dot.className = "bi " + (
            status === "SYNCING" ? "bi-arrow-repeat" :
            status === "ERROR" ? "bi-exclamation-circle-fill" :
            "bi-broadcast"
          );
        }

        textEl.textContent =
          status === "SYNCING" ? "Syncing..." :
          status === "ERROR" ? "Unsynced" :
          "LIVE • " + Store.state.lastSyncTime;
      },

      isUserBusyInteracting() {
        // 1. Jangan timpa tampilan jika ada modal Bootstrap yang sedang terbuka
        if (document.querySelector(".modal.show")) return true;

        // 2. Jangan ganggu kamera QR Check-in yang sedang aktif memindai
        if (Store.state.checkinWorkspace && Store.state.checkinWorkspace.scannerActive) return true;

        // 3. Jangan reset form pendaftaran publik yang sedang diisi peserta
        if (
          Store.state.mode === "public" &&
          Store.state.publicTab === "pendaftaran" &&
          Store.state.regSubTab === "form" &&
          !Store.state.registrationResult
        ) {
          return true;
        }

        // 4. Jangan timpa saat pengguna/admin sedang mengetik di input/textarea/select
        const activeEl = document.activeElement;
        if (activeEl) {
          const tag = activeEl.tagName;
          if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || activeEl.isContentEditable) {
            return true;
          }
        }

        return false;
      },

      async refreshActiveAdminDataSilent() {
        if (!Store.state.user) return;
        const menu = Store.state.adminMenu;

        if (menu === "dashboard") {
          const res = await ApiClient.request("getAdminDashboardSummary", {}, true);
          if (res.success && res.data) Store.state.adminSummary = res.data;
        } else if (menu === "pendaftaran") {
          const res = await ApiClient.request("getAdminRegistrations", {}, true);
          if (res.success && res.data) Store.state.adminRegistrations = res.data.registrations || [];
        } else if (menu === "sekolah") {
          const res = await ApiClient.request("getAdminSchools", {}, true);
          if (res.success && res.data) Store.state.adminSchools = res.data.schools || [];
        } else if (["tim_futsal", "pemain_futsal", "badminton", "hadroh"].includes(menu)) {
          const res = await ApiClient.request("getAdminParticipants", {}, true);
          if (res.success && res.data) Store.state.adminParticipants = res.data;
        } else if (["pembagian_grup", "jadwal", "hasil", "klasemen"].includes(menu)) {
          const res = await ApiClient.request("getAdminTournamentData", {}, true);
          if (res.success && res.data) Store.state.tournamentData = res.data;
        } else if (menu === "penilaian_juri") {
          if (Store.state.hadrohWorkspace && Store.state.hadrohWorkspace.isJuryRole) return;
          const res = await ApiClient.request("getHadrohScoringWorkspace", {}, true);
          if (res.success && res.data) Store.state.hadrohWorkspace = res.data;
        } else if (menu === "qr_checkin") {
          const res = await ApiClient.request("getAdminCheckinData", {}, true);
          if (res.success && res.data) {
            Store.state.checkinWorkspace.stats = res.data.stats || {};
            Store.state.checkinWorkspace.checkins = res.data.checkins || [];
            Store.state.checkinWorkspace.approvedList = res.data.approvedList || [];
          }
        } else if (menu === "galeri") {
          const res = await ApiClient.request("getAdminGallery", {}, true);
          if (res.success && res.data) Store.state.adminGallery = res.data.items || [];
        } else if (menu === "sertifikat") {
          const res = await ApiClient.request("getAdminCertificates", {}, true);
          if (res.success && res.data) Store.state.adminCertificates = res.data.certificates || [];
        } else if (menu === "whatsapp") {
          const res = await ApiClient.request("getAdminWhatsAppWorkspace", {}, true);
          if (res.success && res.data) {
            Store.state.whatsappWorkspace.stats = res.data.stats || {};
            Store.state.whatsappWorkspace.logs = res.data.logs || [];
            Store.state.whatsappWorkspace.recipients = res.data.recipients || [];
          }
        } else if (menu === "pengumuman") {
          const res = await ApiClient.request("getAdminAnnouncements", {}, true);
          if (res.success && res.data) Store.state.adminAnnouncements = res.data.announcements || [];
        }
      },

      async performSilentSyncAll() {
        if (this.isUserBusyInteracting()) return;

        const requests = [
          ApiClient.request("getPublicBootstrap", {}, false),
          ApiClient.request("getPublicPortalData", {}, false),
          ApiClient.request("getPublicGalleryData", {}, false)
        ];

        if (Store.state.mode === "display") {
          requests.push(ApiClient.request("getDisplayBoardData", {}, false));
        }

        const [bootRes, portalRes, galleryRes, displayRes] = await Promise.all(requests);

        if (bootRes && bootRes.success && bootRes.data) Store.state.bootstrap = bootRes.data;
        if (portalRes && portalRes.success && portalRes.data) Store.state.portalData = portalRes.data;
        if (galleryRes && galleryRes.success && galleryRes.data) Store.state.galleryData = galleryRes.data;
        if (displayRes && displayRes.success && displayRes.data) Store.state.displayData = displayRes.data;

        if (Store.state.mode === "admin" && Store.state.user) {
          await this.refreshActiveAdminDataSilent();
        }

        // Cek ulang sebelum render agar tidak menimpa interaksi yang baru dimulai saat fetch berlangsung
        if (!this.isUserBusyInteracting()) {
          Views.render();
        }
      },

      async executeLiveSyncCycle(forceFullSync = false) {
        if (this._isSyncing) return;
        this._isSyncing = true;

        try {
          const pulseRes = await ApiClient.request("getSyncPulse", {}, false, 8000);
          const nowTime = new Date().toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit", second: "2-digit" });

          if (pulseRes && pulseRes.success && pulseRes.data) {
            Store.state.apiConnected = true;
            const serverVer = String(pulseRes.data.syncVersion || "");
            this._syncTickCount += 1;

            // Inisialisasi versi pertama kali tanpa render ulang ganda
            if (!Store.state.lastSyncVersion && !forceFullSync) {
              Store.state.lastSyncVersion = serverVer;
              this.setLiveSyncState("ACTIVE", nowTime);
              return;
            }

            // Jika ada perubahan data di Google Sheets atau waktunya refresh berkala
            if (
              forceFullSync ||
              Store.state.lastSyncVersion !== serverVer ||
              this._syncTickCount >= BCH_SYNC_CONFIG.FORCE_REFRESH_EVERY_TICKS
            ) {
              this.setLiveSyncState("SYNCING");
              Store.state.lastSyncVersion = serverVer;
              this._syncTickCount = 0;
              await this.performSilentSyncAll();
            }

            this.setLiveSyncState("ACTIVE", nowTime);
          } else {
            this.setLiveSyncState("ERROR");
          }
        } catch (err) {
          this.setLiveSyncState("ERROR");
        } finally {
          this._isSyncing = false;
        }
      },

      async triggerManualSync() {
        Utils.showToast("Menyinkronkan data terbaru dari server...", "primary");
        await this.executeLiveSyncCycle(true);
      },

      startAutoLiveSync() {
        if (this._liveSyncTimer) clearInterval(this._liveSyncTimer);

        document.addEventListener("visibilitychange", () => {
          if (!document.hidden) {
            this.executeLiveSyncCycle(false);
          }
        });

        this._liveSyncTimer = setInterval(() => {
          if (!document.hidden) {
            this.executeLiveSyncCycle(false);
          }
        }, BCH_SYNC_CONFIG.POLL_INTERVAL_MS);
      }
    });

    // Jalankan inisialisasi aplikasi utama & aktifkan mesin Auto Live Sync saat DOM siap
    document.addEventListener("DOMContentLoaded", async () => {
      await App.init();
      App.startAutoLiveSync();
    });
  </script>
